name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libxkbcommon-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: cargo build --release --workspace
      - name: Package
        shell: pwsh
        run: |
          $out = "Alyae"
          New-Item -ItemType Directory -Force "$out/modules" | Out-Null
          Copy-Item target/release/alyae.exe, target/release/alyae-roblox.exe, target/release/alyae-roblox-login.exe $out
          foreach ($m in Get-ChildItem modules -Directory) {
            if ($m.Name -notlike "*-linux") { Copy-Item -Recurse $m.FullName "$out/modules/" }
          }
      - name: Portable package
        shell: pwsh
        run: |
          Copy-Item -Recurse Alyae Alyae-portable
          New-Item -ItemType File -Force Alyae-portable/portable | Out-Null
          New-Item -ItemType Directory -Force Alyae-portable/data | Out-Null
          Copy-Item packaging/PORTABLE.txt Alyae-portable/README.txt
          Compress-Archive -Path Alyae-portable -DestinationPath Alyae-portable.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Alyae-windows
          path: Alyae
      - uses: actions/upload-artifact@v4
        with:
          name: Alyae-windows-portable
          path: Alyae-portable
      # the newest main build, always at the same address: the "portable" release
      - name: Publish portable release
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view portable 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create portable --prerelease --title "Alyae portable (Windows, newest main)" --notes "Unzip, start alyae.exe. Built from the newest main; see README.txt inside."
          }
          gh release upload portable Alyae-portable.zip --clobber
