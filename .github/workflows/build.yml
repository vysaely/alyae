name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# read-only by default; only the publish job below may change the release
permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libxkbcommon-dev
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: cargo build --release --workspace
      - name: Package
        shell: pwsh
        run: |
          $out = "Alyae"
          New-Item -ItemType Directory -Force "$out/modules" | Out-Null
          Copy-Item target/release/alyae.exe, target/release/alyae-roblox.exe, target/release/alyae-roblox-login.exe $out
          foreach ($m in Get-ChildItem modules -Directory) {
            if ($m.Name -notlike "*-linux") { Copy-Item -Recurse $m.FullName "$out/modules/" }
          }
      - name: Portable package
        shell: pwsh
        run: |
          Copy-Item -Recurse Alyae Alyae-portable
          New-Item -ItemType File -Force Alyae-portable/portable | Out-Null
          New-Item -ItemType Directory -Force Alyae-portable/data | Out-Null
          Copy-Item packaging/PORTABLE.txt Alyae-portable/README.txt
          Compress-Archive -Path Alyae-portable -DestinationPath Alyae-portable.zip
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Alyae-windows
          path: Alyae
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Alyae-windows-portable
          path: Alyae-portable
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Alyae-portable-zip
          path: Alyae-portable.zip

  # the newest main build, always at the same address: the "portable" release. The only job that
  # can write to the repository, and it runs no build tools: it uploads what the build made.
  publish:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [linux, windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: Alyae-portable-zip
      - name: Publish portable release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release view portable > /dev/null 2>&1 || gh release create portable --prerelease \
            --title "Alyae portable (Windows, newest main)" \
            --notes "Unzip, start alyae.exe. Built from the newest main; see README.txt inside."
          gh release upload portable Alyae-portable.zip --clobber
