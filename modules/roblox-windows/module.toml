# Roblox on Windows, through the official client.
id = "roblox"
name = "Roblox Windows"
platform = "windows"
description = "Several accounts at once, join servers, 2FA"
helper = "ludae-roblox"
title_field = "username"

[[field]]
key = "username"
label = "Username"
hint = "filled in by Refresh"

[[field]]
key = "user_id"
label = "User ID"
hint = "filled in by Refresh"

[[field]]
key = "cookie"
label = "Cookie"
secret = true
hint = ".ROBLOSECURITY value"

[[field]]
key = "password"
label = "Password"
secret = true

[[field]]
key = "totp"
label = "2FA"
kind = "totp"
secret = true
hint = "base32 secret or otpauth:// link"

[[field]]
key = "role"
label = "Role"
kind = "choice"
choices = ["alt", "main"]
hint = "main: full FPS and quality; alt: small, muted, low FPS"

[[field]]
key = "fps"
label = "FPS cap"
hint = "empty: 330 for a main, 6 for an alt; 0: no cap"

[[action]]
id = "play"
label = "Join Server"
primary = true
runs = true

[[action.input]]
key = "place"
label = "Place ID"
hint = "place ID or game link (empty: Roblox home)"

[[action.input]]
key = "server"
label = "Job ID"
hint = "job ID or private server link"

[[action]]
id = "follow"
label = "Follow"
runs = true

[[action.input]]
key = "follow"
label = "Follow"
hint = "username or follow target..."

[[action]]
id = "check"
label = "Refresh"

# online status of every account, every 15 s while the game is shown
[watch]
action = "presence"
every = 15
column = "Online"

# account tools: each chosen account in turn, 4 s apart

[[action]]
id = "privacy"
label = "Who can join"

[[action.input]]
key = "who"
label = "Who can join"
choices = ["All", "Friends", "Followers", "Following", "TrustedFriends", "NoOne"]

[[action]]
id = "friends"
label = "Friends"

[[action.input]]
key = "what"
label = "Do"
choices = ["Decline all requests", "Accept all requests", "Remove all friends"]

[[action]]
id = "unblock_all"
label = "Unblock everyone"
confirm = "Every player these accounts blocked is unblocked."

[[action]]
id = "signout_all"
label = "Sign out everywhere"
confirm = "Every other session of these accounts ends (other PCs, phones, browsers). Ludae keeps a new cookie."

[[action]]
id = "logout"
label = "Log out"
confirm = "The saved cookie stops working; the account needs to sign in again to play."

[[action]]
id = "change_password"
label = "Change password"
confirm = "Needs the saved password (and 2FA secret if Roblox asks). The new one and a new cookie are saved here."

[[action.input]]
key = "new_password"
label = "New password"
hint = "empty: a random 20-character one"
