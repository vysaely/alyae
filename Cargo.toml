[workspace]
members = ["crates/alyae", "crates/alyae-roblox", "crates/alyae-otp", "crates/alyae-roblox-login"]
# the login window needs the system web view (webkit2gtk-4.1 on Linux): install.sh builds it when present
default-members = ["crates/alyae", "crates/alyae-roblox", "crates/alyae-otp"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
