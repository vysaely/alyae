[package]
name = "alyae"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
eframe = { version = "0.37", default-features = false, features = ["glow", "default_fonts", "wayland", "x11"] }
egui_extras = { version = "0.37", default-features = false }
rusqlite = { version = "0.43", features = ["bundled"] }
crypto_secretbox = "0.1"
getrandom = "0.3"
toml = { version = "1", default-features = false, features = ["parse", "serde"] }
alyae-otp = { path = "../alyae-otp" }
dirs = "6"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_Registry"] }

[build-dependencies]
# the icon in alyae.exe (Explorer, taskbar, shortcuts)
embed-resource = "3"

[dev-dependencies]
egui_kittest = { version = "0.37", features = ["eframe"] }
